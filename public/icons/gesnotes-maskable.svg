<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Gesnotes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00288e"/>
      <stop offset="1" stop-color="#3755c3"/>
    </linearGradient>
  </defs>
  <!-- Pleine bordure : la zone sûre d'une icône masquable est le cercle central de 80 %.
       Pas de badge coche ici (contrairement à icons/gesnotes.svg) : à cette taille et avec
       un masque OS variable, un second élément près du bord serait rogné. -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <text x="256" y="256" fill="#ffffff" font-family="Inter, system-ui, sans-serif"
        font-size="180" font-weight="800" text-anchor="middle" dominant-baseline="central"
        letter-spacing="-6">GN</text>
</svg>
