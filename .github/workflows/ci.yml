name: CI Frontend

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Vérification du code (Linter)
        run: npm run lint

      - name: Installation de Chromium (prérendu SEO du build)
        run: npx playwright install --with-deps chromium

      - name: Validation du build production
        run: npm run build
