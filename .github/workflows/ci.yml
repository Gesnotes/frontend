name: CI Frontend

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Vérification du code (Linter)
        run: npm run lint

      # Ubuntu du runner GitHub : "prebuild" (package.json) n'installe que le
      # binaire Chromium, sans droits root pour les dépendances système
      # (incompatible avec des environnements de build comme Render). Ici on
      # peut se permettre --with-deps, le runner ayant un accès sudo.
      - name: Installation des dépendances système de Chromium
        run: sudo npx playwright install-deps chromium

      - name: Validation du build production
        run: npm run build
