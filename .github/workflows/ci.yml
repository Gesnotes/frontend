name: CI

# Bloque la CI sur toute PR — jusqu'ici seul deploy.yml existait, déclenché
# uniquement sur push vers main, sans aucune vérification avant le déploiement.
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build
